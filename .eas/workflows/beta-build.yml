# بناء نسخة آيفون تجريبية جديدة ورفعها لـ TestFlight (للتغييرات الأصلية Native) — عند الرفع لفرع release-beta
# أندرويد يُضاف لاحقاً بعد إعداد حساب Google Play (مفتاح الخدمة في secrets/)
name: Beta build & submit

on:
  push:
    branches: ['release-beta']

jobs:
  build_ios:
    type: build
    params:
      platform: ios
      profile: beta
  submit_ios:
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: beta
