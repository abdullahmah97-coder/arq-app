# بناء نسخة تجريبية جديدة ورفعها للمتجرين (للتغييرات الأصلية Native) — عند الرفع لفرع release-beta
name: Beta build & submit

on:
  push:
    branches: ['release-beta']

jobs:
  build_ios:
    type: build
    params:
      platform: ios
      profile: beta
  build_android:
    type: build
    params:
      platform: android
      profile: beta
  submit_ios:
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: beta
  submit_android:
    type: submit
    needs: [build_android]
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: beta
