   كل الألوان رموز: الفاتح أول، وبعده الداكن (مرتين: حسب الجهاز، وحسب زر الثيم) */

  --bg: #F2F2EF;
  --bg-2: #E9E9E4;
  --card: #FFFFFF;
  --card-2: #F7F7F4;
  --line: #E3E3DD;

  --wait-bg: rgba(241, 85, 29, 0.10);

  --ok: #1F9D5A;
  --ok-ink: #13663D;
  --ok-bg: rgba(31, 157, 90, 0.11);
  --ok-line: rgba(31, 157, 90, 0.45);
  --fail: #C8341A;
  --fail-ink: #A62A0F;
  --fail-bg: rgba(200, 52, 26, 0.09);
  --info-ink: #2C54A6;
  --info-bg: rgba(60, 110, 220, 0.10);
  --series: #F1551D;
  --series-wash: rgba(241, 85, 29, 0.10);
  --series-prev: #CFCFC7;
  --track: #ECECE6;
  --chip: #EDEDE8;
  --chip-on: #121212;
  --chip-on-text: #F2F2EF;
  --seg-on: #FFFFFF;
  --focus: #C4410E;
  --stage-1: #171A19;
  --stage-2: #101211;
  --stage-line: rgba(255, 255, 255, 0.08);
  --stage-text: #F4F4F0;
  --stage-muted: rgba(244, 244, 240, 0.6);

  --sign-on: #F1551D;
  --sign-on-text: #FFFFFF;

  --screen-2: #171A19;
  --screen-line: rgba(255, 255, 255, 0.08);

  --screen-muted: rgba(244, 244, 240, 0.6);
  --screen-up: #3DDC84;
  --screen-down: #FF6A4D;
  --shell: #FFFFFF;
  --tick: #F1551D;
  --font-mono: "IBM Plex Mono", "Noto Kufi Arabic", ui-monospace, monospace;
  --font-display-en: "Anton", "IBM Plex Sans", sans-serif;
  --font-display-ar: "Noto Kufi Arabic", sans-serif;
  --display-ar-weight: 900;
  --font-ar: "Noto Kufi Arabic", "IBM Plex Sans", "Segoe UI", Tahoma, system-ui, sans-serif;
  --font-en: "IBM Plex Sans", "Noto Kufi Arabic", "Segoe UI", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", "Noto Kufi Arabic", ui-monospace, monospace;
  /* العناوين الصغيرة والأزرار: أحادي العرض بحروف كبيرة بالإنجليزي، والكوفي بالعربي (مسافات الأحادي تفرّق الكلمات العربية) */
  --font-label: var(--font-mono);
  --label-case: uppercase;
  --label-ls: 0.06em;
  --r-lg: 12px;
  --r-md: 10px;
  --r-sm: 6px;
  color-scheme: light;
}
:root[lang="ar"] {
  --font-label: "Noto Kufi Arabic", "IBM Plex Mono", ui-monospace, sans-serif;
  --label-case: none;
  --label-ls: 0;
}

/* ===================== الأساس ===================== */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
/* الورق: شبكة مربعات ٤٨px خفيفة فوق لون الصفحة */
body {
  margin: 0;
  color: var(--text);
  background: var(--bg);
  background-image: linear-gradient(to right, var(--grid-line) 1px, transparent 1px), linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
  background-size: 48px 48px;
  background-position: center top;
  font-family: var(--font-ar);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
:root[lang="en"] body { font-family: var(--font-en); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: 0.5; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
::selection { background: rgba(241, 85, 29, 0.24); }
.num, .tnum { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.ic.sm { width: 15px; height: 15px; }
svg.ic.xs { width: 12px; height: 12px; stroke-width: 2.2; }
:root[dir="rtl"] svg.ic.flip { transform: scaleX(-1); }
[dir="auto"], bdi { unicode-bidi: isolate; }
/* نصوص البيانات (عربي أو إنجليزي) تنعرض بترتيبها الصحيح بس تصطف مع اتجاه الصفحة */
:root[dir="rtl"] div[dir="auto"], :root[dir="rtl"] span.tt[dir="auto"], :root[dir="rtl"] li[dir="auto"] { text-align: right; }
:root[dir="ltr"] div[dir="auto"], :root[dir="ltr"] span.tt[dir="auto"], :root[dir="ltr"] li[dir="auto"] { text-align: left; }
ul.points { margin: 0; padding-inline-start: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 1.7; }
ul.points li::marker { color: var(--accent); }

/* عناوين الأقسام: مربع برتقالي ٨px قبلها */
.panel-title::before, .block-title::before, .dash-head h2::before, .group-t::before {
  content: ""; width: 8px; height: 8px; background: var(--accent); flex: none; display: inline-block;
}

.app { max-width: 1680px; margin: 0 auto; padding-inline: clamp(16px, 2.4vw, 36px); padding-block: 14px 40px; display: flex; flex-direction: column; gap: 16px; }

/* ===================== الشريط العلوي ===================== */
.top { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 2px 14px; border-bottom: 1px solid var(--line); }
.top::after { content: ""; position: absolute; inset-inline-start: 0; bottom: -1px; width: 56px; height: 2px; background: var(--accent); }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1 1 260px; }
.logo { width: 38px; height: 38px; border-radius: 0; background: none; color: var(--accent); display: grid; place-items: center; flex: none; }
.logo svg { width: 34px; height: 34px; }
.brand-text { min-width: 0; }
.brand h1 { margin: 0; font-family: var(--font-label); font-size: 17px; line-height: 1.25; font-weight: 700; letter-spacing: var(--label-ls); text-transform: var(--label-case); }
.brand .sub { margin: 2px 0 0; font-family: var(--font-label); font-size: 12px; font-weight: 500; letter-spacing: var(--label-ls); text-transform: var(--label-case); color: var(--accent-ink); }
.top-status { display: flex; align-items: center; gap: 6px 12px; flex-wrap: wrap; min-width: 0; }
.conn { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding-inline: 10px; border-radius: var(--r-sm); font-family: var(--font-label); font-size: 11.5px; font-weight: 600; letter-spacing: var(--label-ls); text-transform: var(--label-case); background: var(--card); border: 1px solid var(--line); white-space: nowrap; }
.conn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.conn.live .dot { background: var(--accent); box-shadow: 0 0 0 3px var(--wait-bg); }
.conn.connecting .dot { background: var(--work); animation: pulse 1.2s ease-in-out infinite; }
.conn.sample .dot { background: var(--work); }
.conn.error .dot, .conn.stale .dot { background: var(--fail); }
.updated { font-family: var(--font-num); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: var(--r-md); background: var(--card); border: 1px solid var(--line); }
.seg button { border: 0; background: transparent; height: 28px; padding-inline: 11px; border-radius: 7px; font-family: var(--font-label); font-size: 11.5px; font-weight: 600; letter-spacing: var(--label-ls); text-transform: var(--label-case); color: var(--muted); white-space: nowrap; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-text); }

/* الأزرار: إطار رفيع وأيقونة برتقالية */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding-inline: 13px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--card); color: var(--text);
  font-family: var(--font-label); font-size: 12px; font-weight: 600; letter-spacing: var(--label-ls); text-transform: var(--label-case); white-space: nowrap; transition: border-color 0.15s, background-color 0.15s, box-shadow 0.15s; }
:root[lang="ar"] .btn { font-size: 13px; }
.btn svg.ic { color: var(--accent); }
.btn:hover:not(:disabled) { border-color: var(--text); }
.btn.icon { width: 34px; padding: 0; }
.btn.primary { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--on-accent); }
.btn.primary svg.ic { color: currentColor; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.06); border-color: var(--accent-strong); }
.btn.dark { background: var(--chip-on); border-color: var(--chip-on); color: var(--chip-on-text); }
.btn.dark svg.ic { color: var(--accent-on-ink); }
.btn.dark:hover:not(:disabled) { border-color: var(--chip-on); box-shadow: 0 0 0 3px var(--wait-bg); }
.btn.danger { background: transparent; border-color: var(--fail); color: var(--fail-ink); }
.btn.danger svg.ic { color: currentColor; }
.btn.danger:hover:not(:disabled) { border-color: var(--fail); background: var(--fail-bg); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover:not(:disabled) { border-color: var(--line-strong); }
.btn.sm { height: 30px; padding-inline: 10px; font-size: 11px; letter-spacing: 0.03em; border-radius: 7px; gap: 6px; }
:root[lang="ar"] .btn.sm { font-size: 12px; }
.btn.wide { width: 100%; }
.btn .spin, .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-inline-end-color: transparent; animation: spin 0.8s linear infinite; flex: none; }
.btn.busy { pointer-events: none; }

/* الشريط التنبيهي (معاينة / اتصال): بطاقة بخط ملوّن بالبداية */
.banner { position: relative; display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--card); box-shadow: var(--shadow); }
.banner::before { content: ""; position: absolute; inset-block: 12px; inset-inline-start: -1px; width: 3px; background: var(--line-strong); border-start-end-radius: 2px; border-end-end-radius: 2px; }
.banner.sample::before, .banner.connecting::before { background: var(--work); }
.banner.error { background: linear-gradient(0deg, var(--wait-bg), var(--wait-bg)), var(--card); }
.banner.error::before { background: var(--accent); }
.banner .b-ic { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); color: var(--accent); flex: none; }
.banner .b-body { flex: 1; min-width: 0; }
.banner strong { display: block; font-family: var(--font-label); font-size: 12.5px; font-weight: 700; letter-spacing: var(--label-ls); text-transform: var(--label-case); line-height: 1.5; }
:root[lang="ar"] .banner strong { font-size: 14px; }
.banner p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.banner .b-act { flex: none; align-self: center; }

/* ===================== الصف الرئيسي: المكتب المختار | حالة المهام ===================== */
.main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: stretch; height: clamp(560px, calc(100vh - 64px), 840px); }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.panel-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.panel-body { padding: 14px 18px 18px; overflow: auto; min-height: 0; flex: 1; display: flex; flex-direction: column; gap: 16px; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
.panel-title { margin: 0; font-family: var(--font-label); font-size: 13px; font-weight: 700; letter-spacing: var(--label-ls); text-transform: var(--label-case); display: flex; align-items: center; gap: 10px; }
:root[lang="ar"] .panel-title { font-size: 15px; }
.panel-title svg.ic { display: none; }

/* لوحة المكتب المختار */
.desk-head { display: flex; align-items: center; gap: 12px; }
/* شارة المكتب: مربع أبيض بإطار رفيع وأيقونة برتقالية (لون المكتب القديم يتجاهل) */
.desk-badge { width: 44px; height: 44px; border-radius: var(--r-md); display: grid; place-items: center; flex: none; background: var(--card) !important; border: 1px solid var(--line-strong); color: var(--accent); }
.desk-badge svg.ic { width: 22px; height: 22px; stroke-width: 1.6; }
.desk-name { margin: 0; font-family: var(--font-display-en); font-weight: 400; font-size: 24px; line-height: 1.1; letter-spacing: 0.01em; text-transform: uppercase; }
:root[lang="ar"] .desk-name { font-family: var(--font-display-ar); font-weight: 800; font-size: 19px; line-height: 1.4; text-transform: none; letter-spacing: 0; }
.desk-role { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.55; }
.counts { display: flex; gap: 6px; flex-wrap: wrap; }

/* الحبوب: نص أحادي صغير */
.pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding-inline: 8px; border-radius: 999px; font-family: var(--font-label); font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: var(--label-case); background: var(--chip); color: var(--muted); white-space: nowrap; }
:root[lang="ar"] .pill { font-size: 11.5px; letter-spacing: 0; }
.pill.num { font-family: var(--font-num); font-weight: 700; }
.pill .num { font-weight: 700; }
.pill.wait { background: var(--wait-bg); color: var(--wait-ink); }
.pill.work { background: var(--work-bg); color: var(--work-ink); }
.pill.ok { background: var(--ok-bg); color: var(--ok-ink); }
.pill.fail { background: var(--fail-bg); color: var(--fail-ink); }
.pill.info { background: var(--info-bg); color: var(--info-ink); }
.pill.plain { background: transparent; color: var(--text); box-shadow: inset 0 0 0 1px var(--line-strong); }
.pill .d { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }

/* أرقام المكتب المختار */
.mini-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.mini { background: var(--card-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 12px; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.mini .k, .tile .k { font-family: var(--font-label); font-size: 10.5px; font-weight: 600; letter-spacing: var(--label-ls); text-transform: var(--label-case); color: var(--muted); line-height: 1.4; }
:root[lang="ar"] .mini .k, :root[lang="ar"] .tile .k { font-size: 12px; font-weight: 500; }
.mini .v { font-family: var(--font-num); font-size: 22px; font-weight: 600; line-height: 1.2; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.mini .v.txt { font-family: inherit; font-size: 15px; font-weight: 700; letter-spacing: 0; line-height: 1.45; }
.mini .s { font-size: 11.5px; color: var(--muted); min-height: 0; }

.block { display: flex; flex-direction: column; gap: 10px; }
.block-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.block-title { margin: 0; font-family: var(--font-label); font-size: 11.5px; font-weight: 700; letter-spacing: var(--label-ls); text-transform: var(--label-case); display: flex; align-items: center; gap: 9px; }
:root[lang="ar"] .block-title { font-size: 13.5px; }
.block-title > svg.ic { display: none; }
.link { border: 0; background: none; padding: 0; color: var(--accent-ink); font-family: var(--font-label); font-size: 11.5px; font-weight: 600; letter-spacing: var(--label-ls); text-transform: var(--label-case); display: inline-flex; align-items: center; gap: 5px; text-underline-offset: 3px; }
:root[lang="ar"] .link { font-size: 12.5px; }
.link:hover { text-decoration: underline; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.empty { padding: 14px; border-radius: var(--r-md); border: 1px dashed var(--line-strong); background: transparent; color: var(--muted); font-size: 12.5px; text-align: center; }
.err-box { padding: 10px 12px; border-radius: var(--r-md); background: var(--fail-bg); color: var(--fail-ink); font-size: 13px; display: flex; flex-direction: column; gap: 6px; overflow-wrap: anywhere; }
.err-box .raw { font-family: var(--font-num); font-size: 11.5px; color: var(--muted); direction: ltr; text-align: start; }
.note-box { padding: 10px 12px; border-radius: var(--r-md); background: var(--info-bg); color: var(--text); font-size: 12.5px; }
.ok-box { padding: 10px 12px; border-radius: var(--r-md); background: var(--ok-bg); color: var(--ok-ink); font-size: 13px; }

/* الوكيل */
.agent { border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; background: var(--card-2); }
.agent-top { display: flex; align-items: center; gap: 10px; }
.agent-top strong { font-family: var(--font-label); font-size: 12px; font-weight: 700; letter-spacing: var(--label-ls); text-transform: var(--label-case); }
:root[lang="ar"] .agent-top strong { font-size: 14px; }
.agent-top .spark-ic { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; background: var(--chip-on); color: var(--accent-on-ink); flex: none; }
.agent p { margin: 0; font-size: 12.5px; color: var(--muted); }
.agent .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.run-state { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--work-ink); }

/* عناصر تحتاج قرار */
.item { border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; background: var(--card); }
.item-top { display: flex; align-items: flex-start; gap: 10px; }
.item-main { flex: 1; min-width: 0; }
.item-name { font-weight: 600; font-size: 13.5px; line-height: 1.5; overflow-wrap: anywhere; }
.item-meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.item-msg { font-size: 13px; line-height: 1.65; overflow-wrap: anywhere; }
.item-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.item.done { opacity: 0.6; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { height: 30px; padding-inline: 12px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--card); color: var(--text); font-family: var(--font-label); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: var(--label-case); white-space: nowrap; }
:root[lang="ar"] .chip { font-size: 12px; letter-spacing: 0; }
.chip:hover:not(:disabled) { border-color: var(--text); }
.chip[aria-checked="true"], .chip[aria-pressed="true"] { background: var(--chip-on); border-color: var(--chip-on); color: var(--chip-on-text); }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label, .flabel { font-family: var(--font-label); font-size: 11px; font-weight: 600; letter-spacing: var(--label-ls); text-transform: var(--label-case); color: var(--text); }
:root[lang="ar"] .field label, :root[lang="ar"] .flabel { font-size: 12.5px; }
/* عنوان الحقل لما يكون نص بدل label (حالة التقرير، القرار…) */
.field > .small:first-child { font-family: var(--font-label); font-size: 11px; font-weight: 600; letter-spacing: var(--label-ls); text-transform: var(--label-case); }
:root[lang="ar"] .field > .small:first-child { font-size: 12.5px; }
.field .hint { font-size: 11.5px; color: var(--muted); }
.field .count { font-size: 11px; color: var(--muted); font-family: var(--font-num); }
.input, textarea.input { width: 100%; border: 1px solid var(--line-strong); background: var(--card); color: var(--text); border-radius: 8px; padding: 8px 11px; font-size: 13.5px; line-height: 1.55; min-width: 0; transition: border-color 0.15s; }
.input::placeholder { color: var(--muted); opacity: 0.8; }
.input:hover:not(:disabled):not(:focus) { border-color: var(--faint); }
textarea.input { min-height: 78px; resize: vertical; }
.input:focus { outline: 2px solid var(--focus); outline-offset: 0; border-color: transparent; }
.confirm { border-radius: 8px; padding: 10px 12px; background: var(--card-2); border: 1px dashed var(--line-strong); display: flex; flex-direction: column; gap: 8px; }
.inline-err { font-size: 12px; color: var(--fail-ink); overflow-wrap: anywhere; }

/* ===================== لوحة المهام ===================== */
.tabs { display: flex; gap: 2px; padding: 3px; background: var(--chip); border: 1px solid var(--line); border-radius: var(--r-md); }
.tabs button { flex: 1; border: 0; background: transparent; height: 32px; border-radius: 7px; font-family: var(--font-label); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: var(--label-case); color: var(--muted); display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; min-width: 0; padding-inline: 4px; }
:root[lang="ar"] .tabs button { font-size: 12.5px; letter-spacing: 0; }
.tabs button:hover { color: var(--text); }
.tabs button[aria-selected="true"] { background: var(--seg-on); color: var(--text); box-shadow: 0 1px 2px rgba(18, 18, 18, 0.08), inset 0 -2px 0 var(--accent); }
.tabs .c { font: 600 10.5px/17px var(--font-num); min-width: 18px; padding-inline: 5px; border-radius: 4px; background: var(--card); color: var(--muted); letter-spacing: 0; }
.tabs button[aria-selected="true"] .c { background: var(--chip); color: var(--text); }
.tabs .c.wait { background: var(--wait-bg); color: var(--wait-ink); }
.tabs button[aria-selected="true"] .c.wait { background: var(--accent-strong); color: var(--on-accent); }
.scope { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.scope input { accent-color: var(--accent); width: 15px; height: 15px; }
.tasks { display: flex; flex-direction: column; gap: 6px; }
.task { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: var(--r-md); padding: 11px 12px; text-align: start; display: grid; grid-template-columns: 3px minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; width: 100%; transition: border-color 0.15s, box-shadow 0.15s; }
.task:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
.task .bar { grid-row: 1 / span 2; width: 3px; height: 100%; min-height: 34px; border-radius: 2px; background: var(--line-strong); justify-self: center; }
.task.waiting .bar { background: var(--wait); }
.task.working .bar { background: var(--work); }
.task.done .bar { background: var(--ok); }
.task.failed .bar { background: var(--fail); }
.task .tt { font-size: 13px; font-weight: 600; line-height: 1.5; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; text-align: start; }
.task .tm { grid-column: 2 / 4; font-size: 11.5px; color: var(--muted); display: flex; gap: 2px 12px; flex-wrap: wrap; align-items: center; }
.task .tm .dk { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--text); }
/* مربع صغير بدل لون المكتب (لون واحد للصفحة) */
.task .tm .dk i { width: 6px; height: 6px; border-radius: 1px; display: inline-block; background: var(--faint) !important; }
.task.waiting .tm .dk i { background: var(--accent) !important; }
.task .st { grid-column: 3; grid-row: 1; }
.task .tm > span:not(.dk) { white-space: nowrap; }
.task.fresh { box-shadow: 0 0 0 2px var(--work); }
.task.pseudo { border-style: dashed; cursor: default; }

/* ===================== لوحات الأقسام تحت المكتب ===================== */
.dash-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.dash-head h2 { margin: 0; display: flex; align-items: center; gap: 10px; font-family: var(--font-label); font-size: 15px; font-weight: 700; letter-spacing: var(--label-ls); text-transform: var(--label-case); }
:root[lang="ar"] .dash-head h2 { font-size: 18px; font-weight: 800; }
.dash-head p { margin: 4px 0 0; font-size: 12.5px; color: var(--muted); }
:root[lang="en"] .dash-head p { font-family: var(--font-mono); font-size: 12px; }
.dash { columns: 2 520px; column-gap: 16px; }
.area { break-inside: avoid; margin-bottom: 16px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 16px; min-width: 0; scroll-margin-top: 12px; }
.area.sel { border-color: var(--accent); }
.area-head { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.area-head .desk-badge { width: 34px; height: 34px; border-radius: 8px; }
.area-head .desk-badge svg.ic { width: 18px; height: 18px; }
.area-head h3 { margin: 0; flex: 1; min-width: 0; font-family: var(--font-label); font-size: 13px; font-weight: 700; letter-spacing: var(--label-ls); text-transform: var(--label-case); }
:root[lang="ar"] .area-head h3 { font-size: 15.5px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.tile { position: relative; background: var(--card-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 11px 12px 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile .v { font-family: var(--font-num); font-size: 24px; font-weight: 600; line-height: 1.2; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tile .v.txt { font-family: inherit; font-size: 14px; line-height: 1.5; font-weight: 700; letter-spacing: 0; }
.tile .v small { font-size: 13px; font-weight: 500; color: var(--muted); }
.tile .s { font-size: 11.5px; color: var(--muted); line-height: 1.45; }
/* تنبيه البطاقة: خط كهرماني بالبداية */
.tile.warn::before { content: ""; position: absolute; inset-block: 10px; inset-inline-start: -1px; width: 3px; background: var(--work); border-start-end-radius: 2px; border-end-end-radius: 2px; }
.dl { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11.5px; }
.delta { direction: ltr; unicode-bidi: isolate; display: inline-flex; align-items: center; gap: 3px; font: 600 11px/1.45 var(--font-num); padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
.delta.good { background: var(--ok-bg); color: var(--ok-ink); }
.delta.bad { background: var(--wait-bg); color: var(--wait-ink); }
.delta.flat { background: var(--chip); color: var(--muted); }
.dl .prev { color: var(--muted); white-space: nowrap; font-size: 11px; }
.spark { position: relative; height: 34px; margin-top: 4px; direction: ltr; }
.spark svg { position: absolute; inset: 0; width: 100%; height: 34px; overflow: visible; }
.spark .end { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--series); box-shadow: 0 0 0 2px var(--card-2); transform: translate(-50%, -50%); pointer-events: none; }
.spark .hl { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line-strong); pointer-events: none; }
.spark .hd { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--series); box-shadow: 0 0 0 2px var(--card-2); transform: translate(-50%, -50%); pointer-events: none; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 16px; }
/* الأشرطة: حبر على مسار فاتح */
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 42%) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 12.5px; }
.bar-row .bl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.bar-row .bt { height: 6px; border-radius: 3px; background: var(--track); position: relative; overflow: hidden; }
.bar-row .bf { position: absolute; inset-block: 0; inset-inline-start: 0; background: var(--text); border-start-end-radius: 3px; border-end-end-radius: 3px; }
.bar-row .bv { font: 600 12px/1.3 var(--font-num); font-variant-numeric: tabular-nums; min-width: 28px; text-align: end; }
.bar-row .bv small { font-weight: 500; color: var(--muted); }
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); min-width: 0; }
.li:first-child { border-top: 0; padding-top: 2px; }
.li .lm { flex: 1; min-width: 0; }
.li .lt { font-size: 13px; font-weight: 600; line-height: 1.5; overflow-wrap: anywhere; }
.li .ls { font-size: 11.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; }
.li .lr { flex: none; display: flex; align-items: center; gap: 6px; }
button.li { width: 100%; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--text); text-align: start; }
button.li:first-child { border-top: 0; }
button.li:hover .lt { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.pri { width: 22px; height: 22px; border-radius: 5px; display: grid; place-items: center; font: 700 11px/1 var(--font-num); flex: none; }
.pri.p1 { background: var(--wait-bg); color: var(--wait-ink); }
.pri.p2 { background: var(--work-bg); color: var(--work-ink); }
.pri.p3 { background: var(--chip); color: var(--muted); }
.meter { height: 6px; border-radius: 3px; background: var(--track); position: relative; overflow: hidden; margin-block: 2px; }
.meter i { position: absolute; inset-block: 0; inset-inline-start: 0; background: var(--text); border-start-end-radius: 3px; border-end-end-radius: 3px; }
.meter.hot i { background: var(--wait); }
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.t th { text-align: start; font-family: var(--font-label); font-weight: 600; color: var(--muted); font-size: 10.5px; letter-spacing: var(--label-ls); text-transform: var(--label-case); padding: 4px 6px 6px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
:root[lang="ar"] table.t th { font-size: 11.5px; }
table.t td { padding: 8px 6px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; font-family: var(--font-num); white-space: nowrap; }
table.t td:first-child { font-family: inherit; white-space: normal; }
table.t tr:last-child td { border-bottom: 0; }
.standing { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--r-md); background: var(--work-bg); font-size: 12.5px; }
.standing svg.ic { color: var(--work-ink); margin-top: 3px; }

/* ===================== ورقة المهمة (والحوارات) ===================== */
dialog.sheet { border: 1px solid var(--line); padding: 0; width: min(640px, calc(100vw - 32px)); max-height: min(88vh, 860px); border-radius: 14px; background: var(--card); color: var(--text); box-shadow: 0 32px 80px -24px rgba(0, 0, 0, 0.45), 0 2px 8px rgba(0, 0, 0, 0.08); overflow: hidden; }
dialog.sheet[open] { display: flex; flex-direction: column; }
dialog.sheet::backdrop { background: var(--overlay, rgba(18, 18, 18, 0.45)); backdrop-filter: blur(2px); }
.sh-head { position: relative; display: flex; align-items: flex-start; gap: 12px; padding: 20px 18px 14px; border-bottom: 1px solid var(--line); }
/* خط برتقالي قصير فوق العنوان (مثل خط العنوان الكبير) */
.sh-head::before { content: ""; position: absolute; top: 0; inset-inline-start: 18px; width: 44px; height: 3px; background: var(--accent); }
.sh-head .desk-badge, .sh-head .sec-ic { width: 40px; height: 40px; border-radius: var(--r-md); }
.sh-head h2 { margin: 0; font-family: var(--font-label); font-size: 14px; font-weight: 700; letter-spacing: var(--label-ls); text-transform: var(--label-case); line-height: 1.4; }
:root[lang="ar"] .sh-head h2 { font-size: 16.5px; font-weight: 800; }
.sh-head .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.sh-body { padding: 16px 18px 18px; overflow: auto; display: flex; flex-direction: column; gap: 14px; min-height: 0; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
.sh-foot { padding: 12px 18px 16px; border-top: 1px solid var(--line); background: var(--card-2); display: flex; flex-direction: column; gap: 8px; }
.sh-foot .row { display: flex; gap: 8px; flex-wrap: wrap; }
.sh-foot .row > * { flex: 1 1 140px; }
.summary { padding: 12px 14px; border-radius: var(--r-md); background: var(--card-2); border: 1px solid var(--line); font-size: 13.5px; line-height: 1.75; }
.checks { display: flex; flex-direction: column; gap: 6px; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; }
.check .ci { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; flex: none; margin-top: 2px; }
.check .ci.y { background: var(--ok-bg); color: var(--ok-ink); }
.check .ci.n { background: var(--fail-bg); color: var(--fail-ink); }
.limits-row { display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 10px; align-items: center; padding: 10px 12px; border-radius: var(--r-md); background: var(--card-2); border: 1px solid var(--line); }
.prio { display: flex; gap: 10px; padding: 10px 12px; border-radius: var(--r-md); background: var(--card); border: 1px solid var(--line); color: var(--text); text-align: start; width: 100%; align-items: flex-start; transition: border-color 0.15s; }
.prio:hover { border-color: var(--line-strong); }
.prio .desk-badge { width: 28px; height: 28px; border-radius: 7px; }
.prio .desk-badge svg.ic { width: 15px; height: 15px; }

/* التنبيه السريع والتلميح: حبر مع مربع برتقالي */
.toast { position: fixed; inset-inline: 0; bottom: 18px; margin-inline: auto; width: max-content; max-width: calc(100vw - 32px); display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-radius: var(--r-md); background: var(--chip-on); color: var(--chip-on-text);
  font-family: var(--font-label); font-size: 12.5px; font-weight: 600; line-height: 1.5; box-shadow: 0 18px 40px -14px rgba(0, 0, 0, 0.5); opacity: 0; transform: translateY(8px); transition: opacity 0.18s, transform 0.18s; pointer-events: none; z-index: 50; }
:root[lang="ar"] .toast { font-size: 13.5px; }
.toast::before { content: ""; width: 8px; height: 8px; background: var(--accent); flex: none; }
.toast.show { opacity: 1; transform: none; }
.tip { position: fixed; z-index: 60; pointer-events: none; padding: 5px 9px; border-radius: 6px; background: var(--chip-on); color: var(--chip-on-text); font: 600 11.5px/1.4 var(--font-num); white-space: nowrap; transform: translate(-50%, calc(-100% - 8px)); box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.4); }
.foot { font-family: var(--font-label); font-size: 11.5px; color: var(--muted); display: flex; gap: 6px 16px; flex-wrap: wrap; justify-content: space-between; padding-top: 14px; border-top: 1px solid var(--line); }
.foot .num { font-family: var(--font-num); font-size: 11px; }

/* ===================== التبويب العلوي: المكتب / التطبيق ===================== */
.top-tabs { display: inline-flex; gap: 2px; padding: 3px; border-radius: var(--r-md); background: var(--card); border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(18, 18, 18, 0.04); flex: none; }
.top-tabs button { border: 0; background: transparent; height: 34px; padding-inline: 14px; border-radius: 7px; font-family: var(--font-label); font-size: 12px; font-weight: 700; letter-spacing: var(--label-ls); text-transform: var(--label-case); color: var(--muted); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
:root[lang="ar"] .top-tabs button { font-size: 14px; }
.top-tabs button svg.ic { color: var(--accent); }
.top-tabs button:hover { color: var(--text); }
.top-tabs button[aria-selected="true"] { background: var(--chip-on); color: var(--chip-on-text); }
.top-tabs button[aria-selected="true"] svg.ic { color: var(--accent-on-ink); }
.view { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

/* ===================== تبويب «التطبيق» ===================== */
.app-grid { display: grid; grid-template-columns: minmax(360px, 470px) minmax(0, 1fr); gap: 16px; align-items: start; }
.sec { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 18px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.sec-head { display: flex; align-items: flex-start; gap: 12px; }
.sec-head h2 { margin: 0; font-family: var(--font-label); font-size: 14px; font-weight: 700; letter-spacing: var(--label-ls); text-transform: var(--label-case); line-height: 1.4; }
:root[lang="ar"] .sec-head h2 { font-size: 17px; font-weight: 800; }
.sec-head p { margin: 4px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.65; }
.sec-ic { width: 40px; height: 40px; border-radius: var(--r-md); display: grid; place-items: center; flex: none; background: var(--card); border: 1px solid var(--line-strong); color: var(--accent); }
.sec-ic svg.ic { width: 20px; height: 20px; stroke-width: 1.6; }
.req-form { display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: var(--r-md); background: var(--card-2); border: 1px solid var(--line); }
.req-form .input { background: var(--card); }
.field-foot { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.reqs, .crows { display: flex; flex-direction: column; gap: 8px; }
.req { position: relative; }
.req::before { content: ""; position: absolute; inset-block: 12px; inset-inline-start: -1px; width: 3px; border-start-end-radius: 2px; border-end-end-radius: 2px; background: var(--line-strong); }
.req.working::before { background: var(--work); }
.req.needs_you::before { background: var(--wait); }
.req.review::before { background: var(--info-ink); }
.req.done::before { background: var(--ok); }
.req.failed::before { background: var(--fail); }
.req.cancelled { opacity: 0.72; }
.req .item-actions > .link:first-child { margin-inline-end: auto; }
.req .link svg.ic.up { transform: rotate(180deg); }
.req-text { white-space: pre-wrap; padding: 9px 11px; border-radius: var(--r-sm); background: var(--card-2); border: 1px solid var(--line); max-height: 220px; overflow: auto; font-size: 13px; }
.item-meta .xlink { font-size: 12px; }
.xlink { display: inline-flex; align-items: center; gap: 5px; color: var(--accent-ink); font-size: 12.5px; font-weight: 600; text-decoration: none; overflow-wrap: anywhere; min-width: 0; text-underline-offset: 3px; }
.xlink:hover { text-decoration: underline; }
.ok-text { color: var(--ok-ink); font-weight: 600; }
.ccr { line-height: 1.65; }
.ctabs { display: flex; flex-wrap: wrap; gap: 2px; padding: 3px; background: var(--chip); border: 1px solid var(--line); border-radius: var(--r-md); }
.ctabs button { border: 0; background: transparent; height: 34px; padding-inline: 12px; border-radius: 7px; font-family: var(--font-label); font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: var(--label-case); color: var(--muted); white-space: nowrap; flex: 1 1 auto; }
:root[lang="ar"] .ctabs button { font-size: 13px; letter-spacing: 0; }
.ctabs button:hover { color: var(--text); }
.ctabs button[aria-selected="true"] { background: var(--seg-on); color: var(--text); box-shadow: 0 1px 2px rgba(18, 18, 18, 0.08), inset 0 -2px 0 var(--accent); }
.ct-panel { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
/* صف محتوى: التفاصيل بجهة، والحالة والأزرار بالجهة الثانية */
.crow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; align-items: start; }
.crow-main { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.crow-side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.crow > .ask { grid-column: 1 / -1; }
:root[dir="rtl"] .crow .txt { text-align: right; }
:root[dir="ltr"] .crow .txt { text-align: left; }
.crow.off { background: var(--card-2); }
.crow.off .item-name { color: var(--muted); }
.crow.live { border-color: var(--ok-line); }
.crow .item-msg { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.crow .chips { justify-content: flex-end; }
.ad-link { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; min-width: 0; }
.mono { font-family: var(--font-num); font-size: 11.5px; overflow-wrap: anywhere; }
.toolbar { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
.toolbar .grow { flex: 1; min-width: 0; }
:root[dir="ltr"] .toolbar > .btn:last-child, :root[dir="rtl"] .toolbar > .btn:last-child { margin-inline-start: auto; }
.field.inline { flex-direction: row; align-items: center; gap: 8px; }
.field.inline .input { width: auto; min-width: 140px; }
.group-t { margin: 6px 0 0; display: flex; align-items: center; gap: 8px; font-family: var(--font-label); font-size: 11px; font-weight: 700; letter-spacing: var(--label-ls); text-transform: var(--label-case); color: var(--muted); }
.group-t::before { width: 6px; height: 6px; }
:root[lang="ar"] .group-t { font-size: 12.5px; }
.search { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.search .input[type="search"] { flex: 1 1 200px; width: auto; }
.search .field.inline .input { min-width: 120px; }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
svg.ic.flip-back { transform: scaleX(-1); }
:root[dir="rtl"] svg.ic.flip-back { transform: none; }
.set-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; align-items: start; }
.set-card { border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px; display: flex; flex-direction: column; gap: 12px; background: var(--card); min-width: 0; }
.set-card > p { margin: 0; line-height: 1.6; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fgrid .field.wide { grid-column: 1 / -1; }
.check-row { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
.check-row input { width: 17px; height: 17px; accent-color: var(--accent); flex: none; }
select.input { appearance: auto; height: 36px; padding-block: 0; }
input.input[type="date"] { height: 36px; }
.input[aria-invalid="true"] { border-color: var(--fail); }
.diff { border: 1px solid var(--line-strong); border-style: solid; }
.diff-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.diff-list li { display: grid; grid-template-columns: minmax(90px, 34%) minmax(0, 1fr); gap: 8px; font-size: 12.5px; align-items: baseline; }
.diff-list .dk { color: var(--muted); font-weight: 600; }
.diff-list .dv { overflow-wrap: anywhere; font-weight: 600; }
.diff-list .dv .old { color: var(--muted); font-weight: 500; text-decoration: line-through; text-decoration-color: var(--faint); }
dialog.sheet.wide { width: min(760px, calc(100vw - 32px)); }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
}

/* ===================== المقاسات ===================== */
@media (max-width: 1100px) {
  .app-grid { grid-template-columns: minmax(0, 1fr); }
}
/* أقل من ١٠٠٠: المكتب المختار فوق والمهام تحته */
@media (max-width: 999px) {
  .main { grid-template-columns: minmax(0, 1fr); height: auto; }
  .panel { max-height: 680px; }
}
@media (max-width: 760px) {
  .top { gap: 10px 12px; }
  .top-tabs { order: 3; width: 100%; }
  .top-tabs button { flex: 1; justify-content: center; }
  .controls { width: 100%; justify-content: space-between; }
  .brand h1 { font-size: 15.5px; }
  .panel { max-height: none; }
  .panel-body { overflow: visible; }
  .panel-head { padding: 14px 14px 12px; }
  .panel-body { padding: 12px 14px 16px; }
  .tile .v { font-size: 21px; }
  .dash { columns: 1; }
  .area { padding: 14px 14px 16px; }
  .sec { padding: 14px; }
  .fgrid { grid-template-columns: minmax(0, 1fr); }
  .ctabs button { flex: 1 1 calc(33% - 4px); padding-inline: 6px; }
  .diff-list li { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .sh-foot .row > * { flex-basis: 120px; }
  dialog.sheet { width: calc(100vw - 16px); max-height: 92vh; }
  dialog.sheet.wide { width: calc(100vw - 16px); }
}
@media (max-width: 600px) {
  .crow { grid-template-columns: minmax(0, 1fr); }
  .crow-side { flex-direction: row-reverse; flex-wrap: wrap; align-items: center; justify-content: space-between; }
}
/* الجوال: أزرار حالة المهام على قد نصها (الإنجليزي بحروف كبيرة أعرض) */
@media (max-width: 480px) {
  .tabs button { flex: 1 1 auto; letter-spacing: 0.02em; padding-inline: 5px; }
}
@media (max-width: 420px) {
  .seg button { padding-inline: 9px; }
  .btn { padding-inline: 11px; }
  .tabs button { font-size: 10.5px; gap: 4px; }
  :root[lang="ar"] .tabs button { font-size: 11.5px; }
  .bar-row { grid-template-columns: minmax(0, 38%) minmax(0, 1fr) auto; }
}

/* نظام الشركة: واجهة تبويب المكتب (الشعار والحالة، شريط الفرق، العنوان والبطاقات، المبنى، الخطوط، خط سير العمل)
   يجي بعد style.css ويستخدم رموزه (القيم الاحتياطية بس لو رمز ناقص). كل الألوان رموز تشتغل بالفاتح والداكن */
.os, .os-brand, .os-status, .os-today {
  --os-mono: var(--font-mono, "IBM Plex Mono", "Noto Kufi Arabic", ui-monospace, monospace);
  --os-disp: var(--font-display-en, "Anton", "IBM Plex Sans", sans-serif);
  --os-disp-ar: var(--font-display-ar, "Noto Kufi Arabic", sans-serif);
  --os-acc: var(--accent, #F1551D);
  --os-tick: var(--tick, var(--accent, #F1551D));
  --os-shell: var(--shell, #FFFFFF);
  --os-shell-ink: #121212; /* حبر على الغلاف الأبيض (الغلاف فاتح بالثيمين) */
  --os-screen: var(--screen, #101211);
  --os-screen-2: var(--screen-2, #171A19);
  --os-screen-line: var(--screen-line, rgba(255, 255, 255, 0.08));
  --os-screen-text: var(--screen-text, #F4F4F0);
  --os-screen-muted: var(--screen-muted, rgba(244, 244, 240, 0.6));
  --os-idle: var(--screen-up, #3DDC84);
}
:root[lang="en"] .os, :root[lang="en"] .os-brand, :root[lang="en"] .os-status, :root[lang="en"] .os-today { --os-ls: 0.05em; }
/* بالعربي الكوفي أول: مسافات الخط أحادي العرض تفرّق الكلمات العربية. الأرقام تبقى IBM Plex Mono (--os-num) */
.os, .os-brand, .os-status, .os-today { --os-num: "IBM Plex Mono", ui-monospace, monospace; }
:root[lang="ar"] .os, :root[lang="ar"] .os-brand, :root[lang="ar"] .os-status, :root[lang="ar"] .os-today { --os-mono: "Noto Kufi Arabic", "IBM Plex Mono", ui-monospace, sans-serif; }

/* ---------- الشعار والحالة (الشريط العلوي) ---------- */
.os-brand { gap: 12px; }
.os-brand .logo.os-mark { width: 38px; height: 38px; border-radius: 0; background: none; box-shadow: none; color: var(--os-acc); display: grid; place-items: center; flex: none; }
.os-brand .logo.os-mark svg { width: 36px; height: 36px; }
.os-brand h1 { margin: 0; font-family: var(--os-mono); font-size: 17px; font-weight: 700; line-height: 1.2; letter-spacing: var(--os-ls, 0); text-transform: uppercase; color: var(--text); }
.os-brand .sub { margin: 3px 0 0; font-family: var(--os-mono); font-size: 12.5px; font-weight: 500; line-height: 1.2; letter-spacing: var(--os-ls, 0); text-transform: uppercase; color: var(--accent-ink, #B83D0E); }
:root[lang="ar"] .os-brand h1 { font-family: var(--os-disp-ar); font-weight: 800; font-size: 18px; }
:root[lang="ar"] .os-brand .sub { font-family: var(--os-disp-ar); font-weight: 600; }
.os-status .conn { height: auto; padding: 4px 0; background: none; border: 0; border-radius: 0; gap: 7px; font-family: var(--os-mono); font-size: 12px; font-weight: 600; letter-spacing: var(--os-ls, 0); text-transform: uppercase; color: var(--text); white-space: nowrap; }
.os-status .os-k { color: var(--muted); font-weight: 500; }
.os-status .conn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); box-shadow: none; animation: none; }
.os-status .conn.live .dot { background: var(--os-acc); box-shadow: 0 0 0 3px var(--wait-bg, rgba(241, 85, 29, 0.16)); }
.os-status .conn.live.warn .dot { background: var(--work, #FEA94F); box-shadow: 0 0 0 3px var(--work-bg, rgba(254, 169, 79, 0.2)); }
.os-status .conn.connecting .dot { background: var(--work, #FEA94F); animation: osPulse 1.2s ease-in-out infinite; }
.os-status .conn.sample .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--os-acc); }
.os-status .conn.error .dot, .os-status .conn.stale .dot { background: var(--fail, #C23A12); }
.os-status .updated { font-family: var(--os-mono); font-size: 11.5px; color: var(--muted); }
@keyframes osPulse { 50% { opacity: 0.35; } }

/* ---------- الواجهة ---------- */
.os {
  position: relative; display: flex; flex-direction: column; gap: 14px; padding: 14px 18px 14px; min-width: 0;
  /* علامات الزوايا البرتقالية */
  background:
    linear-gradient(var(--os-tick) 0 0) left top / 16px 1.5px no-repeat, linear-gradient(var(--os-tick) 0 0) left top / 1.5px 16px no-repeat,
    linear-gradient(var(--os-tick) 0 0) right top / 16px 1.5px no-repeat, linear-gradient(var(--os-tick) 0 0) right top / 1.5px 16px no-repeat,
    linear-gradient(var(--os-tick) 0 0) left bottom / 16px 1.5px no-repeat, linear-gradient(var(--os-tick) 0 0) left bottom / 1.5px 16px no-repeat,
    linear-gradient(var(--os-tick) 0 0) right bottom / 16px 1.5px no-repeat, linear-gradient(var(--os-tick) 0 0) right bottom / 1.5px 16px no-repeat;
}

/* شريط الفرق */
.os-strip { position: relative; z-index: 3; display: flex; align-items: center; gap: 8px; min-width: 0; }
.os-chips { display: flex; gap: 6px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; padding: 3px; margin: -3px; scroll-behavior: smooth; }
.os-chips::-webkit-scrollbar { display: none; }
.os-tab { flex: none; display: inline-flex; align-items: center; gap: 7px; height: 34px; padding-inline: 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--muted);
  font-family: var(--os-mono); font-size: 12px; font-weight: 600; letter-spacing: var(--os-ls, 0); text-transform: uppercase; white-space: nowrap; }
.os-tab svg.ic { color: var(--os-acc); }
.os-tab:hover { border-color: var(--line-strong); color: var(--text); }
.os-tab[aria-current="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }
.os-tab-b { min-width: 19px; height: 19px; padding-inline: 5px; border-radius: 10px; background: var(--os-acc); color: #1A0B04; font: 700 11px/19px var(--os-num); text-align: center; letter-spacing: 0; }
.os-nav { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--text); display: grid; place-items: center; padding: 0; }
.os-nav:hover { border-color: var(--os-acc); color: var(--os-acc); }
.os-count { flex: none; height: 26px; padding-inline: 11px; border-radius: 999px; background: var(--chip, rgba(0, 0, 0, 0.06)); color: var(--muted); font: 600 12px/26px var(--os-num); white-space: nowrap; direction: ltr; }

/* الشبكة: عمود النص (~38%) والمبنى (~62%). بالعربي العمود الأول يمين لحاله */
.os-grid {
  position: relative; display: grid; min-width: 0;
  grid-template-columns: minmax(0, 33fr) minmax(0, 67fr);
  grid-template-areas: "head stage" "cards stage" "ver flow";
  grid-template-rows: auto minmax(0, 1fr) auto;
  column-gap: clamp(20px, 3vw, 48px); row-gap: 14px;
}
.os-head { grid-area: head; min-width: 0; padding-top: 2px; }
.os-h { margin: 0; color: var(--text); font-family: var(--os-disp); font-weight: 400; font-size: clamp(48px, 5.5vw, 104px); line-height: 0.92; letter-spacing: 0.005em; text-transform: uppercase; overflow-wrap: anywhere; }
.os-h > span { display: block; }
.os-h-b { white-space: nowrap; } /* الكلمة الملوّنة ونقطتها ما ينفصلون */
.os-h em { font-style: normal; color: var(--os-acc); }
:root[lang="ar"] .os-h { font-family: var(--os-disp-ar); font-weight: 900; font-size: clamp(40px, 4.6vw, 84px); line-height: 1.16; letter-spacing: 0; }
/* العنوان على قد عمود النص: أطول كلمة («OPERATIONS» ≈ 4.5em، «المهندسين.» ≈ 6.1em) ما تنكسر بالشاشات المتوسطة */
@supports (container-type: inline-size) {
  .os-head { container-type: inline-size; }
  .os-h { font-size: min(clamp(48px, 5.5vw, 104px), 21cqi); }
  :root[lang="ar"] .os-h { font-size: min(clamp(40px, 4.6vw, 84px), 15cqi); }
}
.os-rule { display: block; width: 44px; height: 3px; background: var(--os-acc); margin: 18px 0 12px; }
.os-tag { margin: 0; font-family: var(--os-mono); font-size: 15px; font-weight: 500; line-height: 1.5; color: var(--text); }
.os-tag > span { display: block; }
.os-tag-b { color: var(--accent-ink, #B83D0E); }

/* البطاقات */
.os-cards { grid-area: cards; display: flex; flex-direction: column; gap: 8px; min-width: 0; width: 100%; max-width: 400px; align-self: start; }
/* المقر: ٦ بطاقات أقصر شوي عشان العمود ما يطول عن المبنى (وخط سير العمل يبقى بأول شاشة) */
.os-cards.many { gap: 6px; }
.os-cards.many .os-card { min-height: 52px; padding-block: 6px; }
.os-card {
  display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; grid-template-areas: "ic t chip" "ic d d"; column-gap: 12px; row-gap: 2px; align-items: center;
  width: 100%; min-height: 58px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); text-align: start;
  box-shadow: 0 1px 2px rgba(18, 18, 18, 0.04);
}
.os-card:hover { border-color: var(--line-strong); }
.os-card.sel { border-color: var(--os-acc); box-shadow: inset 3px 0 0 var(--os-acc); }
:root[dir="rtl"] .os-card.sel { box-shadow: inset -3px 0 0 var(--os-acc); }
.os-card-ic { grid-area: ic; width: 38px; height: 38px; display: grid; place-items: center; color: var(--os-acc); }
.os-card-ic svg.ic { width: 28px; height: 28px; stroke-width: 1.5; }
.os-card-m { display: contents; }
.os-card-t { grid-area: t; min-width: 0; font-family: var(--os-mono); font-size: 13px; font-weight: 700; line-height: 1.3; letter-spacing: var(--os-ls, 0); text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.os-card-d { grid-area: d; min-width: 0; font-family: var(--os-mono); font-size: 11px; line-height: 1.45; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.os-card > .os-chip { grid-area: chip; }
.os-chip { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding-inline: 7px; border-radius: 999px; background: var(--chip, rgba(0, 0, 0, 0.06)); color: var(--muted); font: 600 10.5px/1 var(--os-mono); white-space: nowrap; letter-spacing: 0; }
.os-chip i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.os-chip.wait { background: var(--wait-bg); color: var(--wait-ink); }
.os-chip.work { background: var(--work-bg); color: var(--work-ink); }
.os-chip.ok { background: var(--ok-bg); color: var(--ok-ink); }
.os-chip.alert { background: var(--info-bg); color: var(--info-ink); }
.os-chip.idle i { background: var(--faint); }
.os-chip.plain { background: transparent; box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--text); }
.os-chip.plain i { background: var(--os-acc); }

/* المبنى */
.os-stage { grid-area: stage; position: relative; min-width: 0; align-self: stretch;
  /* أقل شي على قد الشاشة؛ ولو عمود النص (العنوان + البطاقات) أطول، المسرح يطول معه (المبنى ما يصغر عنه) */
  min-height: clamp(480px, calc(100vh - var(--os-top, 240px) - 66px), 760px);
  min-height: clamp(480px, calc(100svh - var(--os-top, 240px) - 66px), 760px); }
.os-stage > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.os-hits { position: absolute; inset: 0; pointer-events: none; direction: ltr; z-index: 1; }
.os-hit { position: absolute; pointer-events: auto; border: 0; padding: 0; margin: 0; background: transparent; border-radius: 6px; cursor: pointer; }

/** عنصر DOM: النصوص دايماً textContent (كل البيانات من القاعدة نعاملها كنص غير موثوق) */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'style' && isObj(v)) Object.assign(el.style, v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'value') el.value = v;
      else el.setAttribute(k, v === true ? '' : String(v));
    }
  }
  for (const kid of kids.flat(3)) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

/** يطلّع مصفوفة الصفوف من رد execute_sql: النص بين <untrusted-data-ID> و </untrusted-data-ID>.
 * أول وسم بالنص يجي من المقدمة («within the below <untrusted-data-ID> boundaries») قبل أي بيانات، فناخذ منه المعرّف
 * (uuid عشوائي ما يعرفه أحد) ونقبل بس البلوك اللي بنفس المعرّف: من وسم الفتح اللي بعده لين آخر وسم قفل (البلوك الخارجي).

function between(txt) {
  const m = /<untrusted-data-([A-Za-z0-9_-]+)>/.exec(txt);

  const open = `<untrusted-data-${m[1]}>`;
  const end = txt.lastIndexOf(`</untrusted-data-${m[1]}>`);
  if (end < m.index) return null;
  // لو فيه وسم فتح ثاني بنفس المعرّف قبل القفل فالأول كان ذكره بالمقدمة والبيانات تبدأ من الثاني

  const start = (next >= 0 && next < end ? next : m.index) + open.length;

}
function rowsFromText(s) {
  let txt = s;

    // نص مغلّف بعلامات تنصيص (JSON string): نفكّه أول قبل ما ندوّر على الوسوم
    if (txt.trim().startsWith('"')) { try { const v = JSON.parse(txt); if (typeof v === 'string') { txt = v; continue; } } catch (e) { /* مو JSON */ } }
    const rows = between(txt);
    if (rows) return rows;
    // النص نفسه ممكن يكون JSON (مصفوفة، أو نص مغلّف بعلامات تنصيص)
    try {
      const v = JSON.parse(txt);
      if (Array.isArray(v)) return v;
      if (typeof v === 'string') { txt = v; continue; }
      if (isObj(v) && Array.isArray(v.rows)) return v.rows;
      if (isObj(v) && typeof v.result === 'string') { txt = v.result; continue; }
    } catch (e) { /* مو JSON */ }

  }
  return null;
}

  for (const c of cands) {

async function sql(query, { read = false } = {}) {
  if (!mcp) { const e = new Error('no_mcp'); e.code = 'not_granted'; throw e; }
  // الحساب تغيّر: ما نرسل شي بعدها أبد (لين تنفتح الصفحة من جديد)
  if (state.conn && state.conn.kind === 'user_changed') { const e = new Error('user_changed'); e.code = 'user_changed'; throw e; }

const errText = (e) => [e && e.message, e && e.result ? (() => { try { return JSON.stringify(e.result); } catch (x) { return ''; } })() : ''].filter(Boolean).join(' ');

function dbCode(e) {
  if (e instanceof ArgError) return 'bad_input';
  const txt = errText(e);
  for (const c of DB_CODES) if (new RegExp(`\\b${c}\\b`).test(txt)) return c;
  if (/read-only transaction|read only transaction/i.test(txt)) return 'read_only';
  if (/permission denied/i.test(txt)) return 'permission_denied';
  if (/(office_overview|office_admin)[\s\S]{0,80}does not exist|schema "office_admin" does not exist/i.test(txt)) return 'not_installed';

const isOpenStatus = (s) => s === 'scheduled' || s === 'in_progress' || s === 'waiting_approval';

  const it = items.find((x) => x && x.id === task.target_id);

/** عدّادات كل مكتب: ينتظرك (مهام الوكيل + العناصر اللي بدون مهمة وكيل)، شغّال، منتهي، تحتاج نظرة */
function deskStates() {
  const o = state.data || {};
  const tasks = arr(state.tasks);
  const st = Object.fromEntries(DESKS.map((d) => [d.id, { waiting: 0, working: 0, done: 0, alert: 0 }]));
  for (const task of tasks) {
    const d = deskOf(task.desk);
    const p = phase(task);
    if (p === 'waiting') st[d].waiting++; else if (p === 'working') st[d].working++; else st[d].done++;
  }
  // طلبات الشركاء والتقارير الجديدة اللي ما عليها مهمة وكيل مفتوحة = تنتظر قرارك يدوي.
  // القاعدة تعدّ المغطّى على كل العناصر (pending_covered / new_covered)؛ القوائم مقصوصة (25 و20)، فنعدّ منها بس لو المفتاح ناقص (قاعدة أقدم)
  const has = (path) => typeof get(o, path) === 'number';
  const openAgent = (x) => x && x.agent_task && isOpenStatus(x.agent_task.status);
  const items = arr(get(o, 'partners.items'));
  for (const k of PARTNER_KINDS) {
    const covered = has(`partners.pending_covered.${k}`) ? n(o, `partners.pending_covered.${k}`) : items.filter((x) => openAgent(x) && x.kind === k).length;
    st[KIND_DESK[k]].waiting += Math.max(0, n(o, `partners.pending.${k}`) - covered);
  }
  const repCovered = has('reports.new_covered') ? n(o, 'reports.new_covered') : arr(get(o, 'reports.latest_new')).filter(openAgent).length;
  st.reports.waiting += Math.max(0, n(o, 'reports.by_status.new') - repCovered);
  if (state.run && (state.run.phase === 'queued' || state.run.phase === 'waiting') && st[state.run.desk]) st[state.run.desk].working++;
  // تنبيهات (ما تحتاج قرار من هنا بس تستاهل نظرة)
  st.bookings.alert = arr(get(o, 'bookings.attention')).filter((x) => x && x.priority === 1).length;
  st.activity.alert = n(o, 'activity.errors.today');
  st.community.alert = n(o, 'community.moderation.reported.open') + n(o, 'community.challenges.ended_unsettled');
  st.orders.alert = n(o, 'store.products.sold_out');
  st.marketing.alert = (o.marketing && n(o, 'marketing.ads.live_marketing') === 0 ? 1 : 0) + n(o, 'marketing.events.past_still_active');
  // المدير: كل اللي ينتظر موافقتك من المكاتب يوصله
  st.lead.waiting = DESKS.reduce((a, d) => a + (d.id === 'lead' ? st.lead.waiting : st[d.id].waiting), 0);
  return st;
}

// ===================== مسودات الموافقة (نفس منطق officeAgentsCore.ts) =====================
function validNudgeText(category, title, body) {
  const allowed = NUDGE_VARS[category];
  if (!allowed || typeof title !== 'string' || typeof body !== 'string') return false;
  for (const s of [title, body]) {
    const rest = s.replace(/\{([^{}]*)\}/g, (m, k) => (allowed.includes(k) ? '' : '\u0000'));
    if (/[{}\u0000]/.test(rest)) return false;
  }
  const a = title.trim(), b = body.trim();
  return a.length >= 1 && a.length <= 80 && b.length >= 3 && b.length <= 240;
}
function toNum(v) {
  if (typeof v === 'number') return Number.isFinite(v) ? v : null;
  if (typeof v !== 'string') return null;
  const s = v.trim().replace(/[٠-٩]/g, (d) => String('٠١٢٣٤٥٦٧٨٩'.indexOf(d))).replace(/[۰-۹]/g, (d) => String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)));
  return /^-?\d+(\.\d+)?$/.test(s) ? Number(s) : null;
}
function draftFrom(task) {
  const o = isObj(task.output) ? task.output : null;
  if (!o) return null;
  switch (task.kind) {
    case 'triage_report': return { status: REPORT_FINAL.includes(o.status) ? o.status : 'seen', reply: str(o.reply) };
    // رسالة الشريك توصله مع الرفض بس، فمع توصية القبول تبدأ فاضية
    case 'review_partner': return { decision: o.recommendation === 'reject' ? 'reject' : 'approve', note: o.recommendation === 'reject' ? str(o.note) : '' };
    case 'draft_nudge': return isObj(o.template) ? { template: { category: str(o.template.category), gender: str(o.template.gender), locale: str(o.template.locale), title: str(o.template.title), body: str(o.template.body) } } : null;
    case 'review_ai_limits': return { barcode_per_day: str(o.barcode_per_day), meal_photos_per_day: str(o.meal_photos_per_day) };
    default: return null;
  }
}
/** يتحقق من مسودتك قبل ما تنرسل (القاعدة تتحقق بعد بنفسها) */
function prepareFinal(kind, d) {
  if (!isObj(d)) return { error: 'final_bad' };
  switch (kind) {
    case 'triage_report': {
      if (!REPORT_FINAL.includes(d.status) || typeof d.reply !== 'string') return { error: 'final_bad' };
      const reply = d.reply.trim();
      if (reply.length > REPLY_MAX) return { error: 'final_reply' };
      return { final: { status: d.status, reply } };
    }
    case 'review_partner': {
      if (!['approve', 'reject'].includes(d.decision)) return { error: 'final_bad' };
      const note = str(d.note).trim().slice(0, NOTE_MAX).trim();
      if (d.decision === 'reject' && note.length < 3) return { error: 'note_required' };
      return { final: { decision: d.decision, note: d.decision === 'reject' ? note : '' } };
    }
    case 'draft_nudge': {
      const tp = d.template;
      if (!isObj(tp) || !NUDGE_CATS.includes(tp.category) || !NUDGE_WHO.includes(tp.gender) || !LANGS.includes(tp.locale)) return { error: 'final_bad' };
      if (!validNudgeText(tp.category, str(tp.title), str(tp.body))) return { error: 'bad_nudge' };
      return { final: { template: { category: tp.category, gender: tp.gender, locale: tp.locale, title: str(tp.title).trim(), body: str(tp.body).trim() } } };
    }
    case 'review_ai_limits': {
      const a = toNum(d.barcode_per_day), b = toNum(d.meal_photos_per_day);
      if (a === null || b === null) return { error: 'final_bad' };
      const c = (x, hi) => Math.max(0, Math.min(hi, Math.round(x)));
      return { final: { barcode_per_day: c(a, LIMIT_MAX.barcode_per_day), meal_photos_per_day: c(b, LIMIT_MAX.meal_photos_per_day) } };
    }
    default: return { error: 'final_bad' };
  }
}

  const by = zero();

function simUncover(kind) {
  const o = state.data;
  if (kind === 'report') { if (typeof get(o, 'reports.new_covered') === 'number') o.reports.new_covered = Math.max(0, o.reports.new_covered - 1); }
  else if (typeof get(o, `partners.pending_covered.${kind}`) === 'number') o.partners.pending_covered[kind] = Math.max(0, o.partners.pending_covered[kind] - 1);

function simDecideItem(kind, id) {
  const o = state.data;
  const list = kind === 'report' ? arr(get(o, 'reports.latest_new')) : arr(get(o, 'partners.items'));
  const it = list.find((x) => x && x.id === id);
  if (it && it.agent_task) simUncover(kind);
  if (kind === 'report') {
    o.reports.latest_new = arr(o.reports.latest_new).filter((x) => x.id !== id);

    o.partners.pending[kind] = Math.max(0, n(o, `partners.pending.${kind}`) - 1);

function simTaskDone(task, decision, extra) {

/** يرجّع true لو انطبق محلياً (المعاينة) */
function simulate(action, a) {
  const tasks = arr(state.tasks);
  if (action === 'apply' || action === 'reject') {
    const task = tasks.find((x) => x.id === a.id);
    if (!task || task.status !== 'waiting_approval') throw Object.assign(new Error('not_waiting'), { code: 'tool_error' });
    if (action === 'apply') {
      simTaskDone(task, 'approved', { final: a.final });
      if (task.target_kind === 'report') {
        simDecideItem('report', task.target_id);
        state.data.reports.by_status[a.final.status] = n(state.data, `reports.by_status.${a.final.status}`) + 1;
      } else if (task.target_kind) simDecideItem(task.target_kind, task.target_id);
      if (task.kind === 'review_ai_limits') Object.assign(state.data.ai.limits, a.final);
      if (task.kind === 'draft_nudge') state.data.marketing.nudges.templates_paused = n(state.data, 'marketing.nudges.templates_paused') + 1;
    } else simTaskDone(task, 'rejected', { decision_note: a.note || null });
  } else if (action === 'review' || action === 'report') {
    const kind = action === 'report' ? 'report' : a.kind;
    if (action === 'report' && a.status === 'new') return true;
    simDecideItem(kind, a.id);
    if (action === 'report') state.data.reports.by_status[a.status] = n(state.data, `reports.by_status.${a.status}`) + 1;
  }
  // عناصر باقية ومهمة وكيلها انقفلت: نشيل الربط وتصير تنتظر قرارك يدوي
  const unlink = (x, kind) => {
    const tk = x && x.agent_task ? tasks.find((y) => y.id === x.agent_task.id) : null;
    if (tk && !isOpenStatus(tk.status)) { x.agent_task = null; simUncover(kind); }
  };
  for (const x of arr(get(state.data, 'partners.items'))) unlink(x, x.kind);
  for (const x of arr(get(state.data, 'reports.latest_new'))) unlink(x, 'report');
  recountOffice();
  return true;
}

/** خط صغير لسلسلة يومية: آخر نقطة (اليوم) عليها نقطة، والمرور يعرض اليوم والقيمة */
function spark(series) {
  const pts = arr(series).map((p) => ({ day: p.day, n: num(p.n) }));
  if (pts.length < 2) return null;
  const W = 200, H = 34, P = 4;
  const max = Math.max(1, ...pts.map((p) => p.n));
  const xs = (i) => P + (i * (W - 2 * P)) / (pts.length - 1);
  const ys = (v) => H - P - (v / max) * (H - 2 * P);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${xs(i).toFixed(1)},${ys(p.n).toFixed(1)}`).join('');
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('preserveAspectRatio', 'none');
  svg.setAttribute('aria-hidden', 'true');
  const area = document.createElementNS(NS, 'path');
  area.setAttribute('d', `${line}L${xs(pts.length - 1).toFixed(1)},${H}L${xs(0).toFixed(1)},${H}Z`);
  area.setAttribute('style', 'fill: var(--series-wash); stroke: none');
  const path = document.createElementNS(NS, 'path');
  path.setAttribute('d', line);
  path.setAttribute('style', 'fill: none; stroke: var(--series); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round');
  path.setAttribute('vector-effect', 'non-scaling-stroke');
  svg.append(area, path);
  const last = pts.length - 1;
  const total = pts.reduce((a, p) => a + p.n, 0);
  const wrap = h('div', { class: 'spark', role: 'img', 'aria-label': `${fmtDate(pts[0].day)} – ${fmtDate(pts[last].day)}: ${fmt(total)} · ${t('k_today')} ${fmt(pts[last].n)}` }, svg,
    h('span', { class: 'end', style: { left: `${(xs(last) / W) * 100}%`, top: `${ys(pts[last].n)}px` } }));
  const hl = h('span', { class: 'hl', hidden: true });
  const hd = h('span', { class: 'hd', hidden: true });
  wrap.append(hl, hd);
  wrap.addEventListener('pointermove', (ev) => {
    const r = wrap.getBoundingClientRect();
    const fx = ((ev.clientX - r.left) / r.width) * W;
    const i = Math.max(0, Math.min(last, Math.round(((fx - P) / (W - 2 * P)) * last)));
    const left = (xs(i) / W) * 100;
    hl.hidden = false; hd.hidden = false;
    hl.style.left = `${left}%`;
    hd.style.left = `${left}%`;
    hd.style.top = `${ys(pts[i].n)}px`;
    showTip(r.left + (xs(i) / W) * r.width, r.top + ys(pts[i].n), `${fmtDate(pts[i].day)} · ${fmt(pts[i].n)}`);
  });
  wrap.addEventListener('pointerleave', () => { hl.hidden = true; hd.hidden = true; hideTip(); });
  return wrap;
}

function tabCounts(tasks) {
  const c = { all: tasks.length, waiting: 0, working: 0, done: 0 };
  for (const x of tasks) { const p = phase(x); if (p === 'waiting') c.waiting++; else if (p === 'working') c.working++; else c.done++; }
  return c;
}

  // وهي ظاهرة: أول مرة، وبعدها مرة بالدقيقة بالكثير (مع تحديث المكتب) — ولو فشلت نعيد بعد دقيقة. force = زر «تحديث»
  if (state.top !== 'office' || state.slide !== 'eng' || app.isSample || app.reqLoading || !appCanLoad()) return;
  if (!force && Array.isArray(app.requests) && Date.now() - app.reqAt < REFRESH_MS) return;
  if (!force && engTry && Date.now() - engTry < REFRESH_MS) return;
  engTry = Date.now();
  loadRequests().then(() => { if (state.top === 'office') renderHero(); });
}

// ---------- التنقل ----------
let fadeTimer = 0;
/** يبدّل الشريحة بدون رسم (مع ظهور تدريجي ١٨٠ms، وبدونه مع تقليل الحركة). يرجّع true لو تغيّرت */
function switchSlide(id) {
  if (!OS_SLIDE[id] || state.slide === id) return false;
  state.slide = id;
  store('slide', id);
  if (!reducedMotion()) {
    const g = $('osGrid');
    g.classList.remove('os-in'); void g.offsetWidth; g.classList.add('os-in');
    clearTimeout(fadeTimer); fadeTimer = setTimeout(() => g.classList.remove('os-in'), 260);
  }
  return true;
}
function setSlide(id) {
  const changed = switchSlide(id);
  // فريق ما فيه المكتب المختار: نختار أول مكتب فيه (لوحة المكتب تحت تتبع الشريحة). المقر والمهندسين بدون مكاتب
  const desks = changed ? teamDesks(id) : [];
  if (desks.length && !desks.includes(state.desk)) { state.desk = desks[0]; store('desk', state.desk); renderAll(); }
  else renderHero();
  if (changed) revealTab();
}
/** بعد تبديل الشريحة من بطاقة: البطاقة انشالت والتركيز ضاع → أول بطاقة بالشريحة الجديدة */
function focusSlide() {
  const a = document.activeElement;
  if (a && a !== document.body && a.isConnected) return;
  const c = $('osCards').querySelector('.os-card') || $(`os-tab-${state.slide}`);
  if (c) c.focus({ preventScroll: true });
}
function stepSlide(dir) {
  const i = OS_SLIDES.findIndex((s) => s.id === state.slide);
  setSlide(OS_SLIDES[(i + dir + OS_SLIDES.length) % OS_SLIDES.length].id);
}
/** ضغطة غرفة: بالمقر تفتح شريحة فريقها (وتختار المكتب)، وبالفريق تختار المكتب، والمهندسين يفتحون الطلبات */
function roomClick(id) {
  if (id === 'eng') { if (state.slide === 'hq') setSlide('eng'); else openApp('list'); return; }
  if (!DESK[id]) return;
  if (state.slide === 'hq') {
    state.desk = id; store('desk', id);
    switchSlide(teamOf(id));
    renderAll();
    revealTab();
    return;
  }
  selectDesk(id);
}

  if (o && state.errs.overview) { note.hidden = false; put(note, errBox(state.errs.overview, t('dash_stale'))); } else { note.hidden = true; note.replaceChildren(); }
  const sel = AREA_OF[state.desk];

    let body;

    else { try { body = areaBody(id, o); } catch (e) { body = [errBox({ msg: t('err_generic'), raw: str(e && e.message) })]; } }
    return h('section', { class: `area${sel === id ? ' sel' : ''}`, id: `area-${id}`, 'aria-labelledby': `area-${id}-t` }, head, body);

function openSheet(id) {
  const task = arr(state.tasks).find((x) => x.id === id);

  state.sheet = { id, draft: draftFrom(task), rejecting: false, note: '', busy: null, err: null, errCode: null, status: task.status };

  const o = isObj(task.output) ? task.output : null;
  if (!o) return [];
  // اللي خلص: نعرض اللي انطبق فعلاً (final)، وإلا اقتراح الوكيل
  const value = editable ? sh.draft : (task.decision === 'approved' && isObj(task.final) ? Object.assign({}, draftFrom(task) || {}, task.final) : draftFrom(task));
  const set = (patch) => { sh.draft = Object.assign({}, sh.draft || {}, patch); renderSheet(); };
  const out = [];
  const summary = o.summary || o.why;

function focusState() {
  const a = document.activeElement;
  if (!a || !a.id || a === document.body) return null;
  const s = { id: a.id };
  try { if (typeof a.selectionStart === 'number') { s.start = a.selectionStart; s.end = a.selectionEnd; } } catch (e) { /* مو حقل نص */ }
  return s;
}
function restoreFocus(s) {
  if (!s || (document.activeElement && document.activeElement.id === s.id && document.activeElement.isConnected)) return;
  const el = document.getElementById(s.id);
  if (!el) return;
  el.focus({ preventScroll: true });
  try { if (typeof s.start === 'number' && typeof el.setSelectionRange === 'function') el.setSelectionRange(s.start, s.end); } catch (e) { /* مو حقل نص */ }
}
let toastTimer = 0;
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);

}
